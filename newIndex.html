<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Manuais Mopar</title>
  <!-- Importando a biblioteca SheetJS (xlsx) para leitura do Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --input-bg: #0f172a;
    }

    :root[data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --input-bg: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 { font-size: 1.25rem; font-weight: 600; }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      width: 24px;
      height: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    select {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.8rem;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Portal de Manuais</h1>
      <button class="theme-toggle" id="themeIcon" onclick="toggleTheme()"></button>
    </div>

    <div class="form-group">
      <label for="selectMarca">Marca</label>
      <select id="selectMarca"><option value="">Aguardando dados...</option></select>
    </div>

    <div class="form-group">
      <label for="selectModelo">Modelo</label>
      <select id="selectModelo" disabled><option value="">Modelo</option></select>
    </div>

    <!-- Dropdown de Edição (Caso não tenha acessórios) -->
    <div class="form-group" id="groupEdicao">
      <label for="selectEdicao">Edição</label>
      <select id="selectEdicao" disabled><option value="">Edição</option></select>
    </div>

    <!-- Dropdown de Acessório (Caso tenha 04 - acessorios) -->
    <div class="form-group" id="groupAcessorio" style="display: none;">
      <label for="selectAcessorio">Acessório</label>
      <select id="selectAcessorio" disabled><option value="">Selecione o Acessório</option></select>
    </div>

    <div class="form-group">
      <label for="selectPN">Part Number (PN) / Arquivo</label>
      <select id="selectPN" disabled><option value="">PN</option></select>
    </div>

    <button id="btnAbrir" class="btn-submit" disabled onclick="abrirManual()">Abrir Arquivo</button>
    <div id="statusMsg" class="status-msg">Carregando dados da planilha Pasta1.xlsx...</div>
  </div>

  <script>
    let database = {};

    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93-1.41 1.41"/></svg>`;
    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    function updateThemeUI(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').innerHTML = theme === 'dark' ? moonIcon : sunIcon;
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      updateThemeUI(current === 'dark' ? 'light' : 'dark');
    }

    async function initExcel() {
      const status = document.getElementById('statusMsg');
      try {
        const response = await fetch('Pasta1.xlsx');
        if (!response.ok) throw new Error(`Não foi possível carregar o arquivo Pasta1.xlsx (HTTP ${response.status})`);

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });

        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet);

        database = {};

        rows.forEach(row => {
          const marca = (row.Marca || row.MARCA || "").trim();
          if (/^\d/.test(marca)) return;

          const modelo = (row.Modelo || row.MODELO || "").trim();
          
          let edicao = (row.Edicao || row.Edição || row.EDICAO || "").trim();
          let acessorio = (row.Acessorio || row.Acessório || row.ACESSORIO || "").trim();

          const folderPath = (row["Folder Path"] || "").trim();
          let pertencePasta05 = false; // Flag para garantir que só pega o que está dentro da pasta 05

          if (folderPath) {
            const segments = folderPath.split("/").filter(s => s.trim() !== "");
            
            const idxAcessorios = segments.findIndex(s => s.toUpperCase().includes("04 - ACESSORIOS") || s.toUpperCase().includes("04 - ACESSÓRIOS"));

            if (idxAcessorios !== -1) {
              edicao = segments[idxAcessorios]; // ex: "04 - Acessórios"
              if (segments.length > idxAcessorios + 1) {
                acessorio = segments[idxAcessorios + 1]; // ex: nome do acessório
              }

              // Verifica se em algum nível após o acessório existe a pasta "05" (ex: "05 - Manuais de Instrução")
              const temPasta05 = segments.some((s, index) => index > idxAcessorios && s.toUpperCase().includes("05 -"));
              if (temPasta05) {
                pertencePasta05 = true;
              }
            } else if (!edicao) {
              edicao = "GERAL";
              pertencePasta05 = true; // Se não for acessórios, edições normais são aceitas
            } else {
              pertencePasta05 = true;
            }
          } else {
            pertencePasta05 = true;
          }

          // Se for uma linha dentro de acessórios mas NÃO estiver na pasta 05, ignora o arquivo
          const isAcessorioFolder = edicao.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes("04 - ACESSORIOS");
          if (isAcessorioFolder && !pertencePasta05) return;

          if (!edicao) edicao = "GERAL";

          const nomeArquivo = (row.Name || row.PN || row.Arquivo || "").trim();
          
          let url = (row.Url || row.URL || row["Folder Path"] || "").trim();
          if (url && nomeArquivo && !url.endsWith('/')) {
            url = url + '/' + nomeArquivo;
          } else if (url && nomeArquivo) {
            url = url + nomeArquivo;
          }

          if (!marca || !modelo || !nomeArquivo) return;

          let pn = nomeArquivo.replace(/\.[^/.]+$/, ""); 
          const pnMatch = nomeArquivo.match(/\b\d{7,8}\b/);
          if (pnMatch) pn = `PN ${pnMatch[0]} (${pn})`;

          if (!database[marca]) database[marca] = {};
          if (!database[marca][modelo]) database[marca][modelo] = {};

          if (isAcessorioFolder) {
            const nomeSubAcessorio = acessorio || "GERAL";
            if (!database[marca][modelo][edicao]) database[marca][modelo][edicao] = {};
            if (!database[marca][modelo][edicao][nomeSubAcessorio]) database[marca][modelo][edicao][nomeSubAcessorio] = [];
            
            database[marca][modelo][edicao][nomeSubAcessorio].push({ pn, url });
          } else {
            if (!database[marca][modelo][edicao]) database[marca][modelo][edicao] = [];
            if (Array.isArray(database[marca][modelo][edicao])) {
              database[marca][modelo][edicao].push({ pn, url });
            }
          }
        });

        status.textContent = "Base carregada com sucesso do Excel!";
        listBrand();

      } catch (err) {
        console.error(err);
        status.innerHTML = `Erro: ${err.message}. Certifique-se de rodar via Live Server.`;
      }
    }

    function listBrand() {
      const selectMarca = document.getElementById('selectMarca');
      selectMarca.innerHTML = '<option value="">Selecione a Marca</option>';

      Object.keys(database).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        selectMarca.appendChild(opt);
      });
    }

    function listModel() {
      const marca = document.getElementById('selectMarca').value;
      const selectModelo = document.getElementById('selectModelo');
      
      selectModelo.innerHTML = '<option value="">Selecione o Modelo</option>';
      selectModelo.disabled = true;

      resetFields('model');

      if (marca && database[marca]) {
        selectModelo.disabled = false;
        Object.keys(database[marca]).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(mod => {
          const opt = document.createElement('option');
          opt.value = mod;
          opt.textContent = mod;
          selectModelo.appendChild(opt);
        });
      }
    }

    function listEditOrAccessories() {
      const marca = document.getElementById('selectMarca').value;
      const modelo = document.getElementById('selectModelo').value;
      
      const selectEdicao = document.getElementById('selectEdicao');
      const groupEdicao = document.getElementById('groupEdicao');
      const groupAcessorio = document.getElementById('groupAcessorio');
      const selectAcessorio = document.getElementById('selectAcessorio');

      resetFields('edition');

      if (!marca || !modelo || !database[marca][modelo]) return;

      const edicoesDisponiveis = Object.keys(database[marca][modelo]);

      const pastaAcessorios = edicoesDisponiveis.find(e => 
        e.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes("04 - ACESSORIOS")
      );

      if (pastaAcessorios) {
        groupEdicao.style.display = 'none';
        groupAcessorio.style.display = 'block';
        selectAcessorio.disabled = false;
        selectAcessorio.innerHTML = '<option value="">Selecione o Acessório</option>';

        const subAcessorios = database[marca][modelo][pastaAcessorios];
        Object.keys(subAcessorios).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(acessorio => {
          const opt = document.createElement('option');
          opt.value = acessorio;
          opt.textContent = acessorio;
          selectAcessorio.appendChild(opt);
        });
      } else {
        groupEdicao.style.display = 'block';
        groupAcessorio.style.display = 'none';
        selectEdicao.disabled = false;
        selectEdicao.innerHTML = '<option value="">Selecione a Edição</option>';

        edicoesDisponiveis.sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(e => {
          const opt = document.createElement('option');
          opt.value = e;
          opt.textContent = e;
          selectEdicao.appendChild(opt);
        });
      }
    }

    function listPn() {
      const marca = document.getElementById('selectMarca').value;
      const modelo = document.getElementById('selectModelo').value;
      const selectEdicao = document.getElementById('selectEdicao').value;
      const selectAcessorio = document.getElementById('selectAcessorio').value;
      
      const groupAcessorio = document.getElementById('groupAcessorio');
      const selectPN = document.getElementById('selectPN');
      const btnAbrir = document.getElementById('btnAbrir');

      selectPN.innerHTML = '<option value="">Selecione o PN / Arquivo</option>';
      btnAbrir.disabled = true;

      let listaPns = [];

      if (groupAcessorio.style.display === 'block') {
        if (!selectAcessorio) return;
        const edicoes = Object.keys(database[marca][modelo]);
        const pastaAcessorios = edicoes.find(e => 
          e.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes("04 - ACESSORIOS")
        );
        if (pastaAcessorios && database[marca][modelo][pastaAcessorios][selectAcessorio]) {
          listaPns = database[marca][modelo][pastaAcessorios][selectAcessorio];
        }
      } else {
        if (selectEdicao && database[marca][modelo][selectEdicao] && Array.isArray(database[marca][modelo][selectEdicao])) {
          listaPns = database[marca][modelo][selectEdicao];
        }
      }

      if (listaPns.length > 0) {
        selectPN.disabled = false;
        listaPns.sort((a, b) => a.pn.localeCompare(b.pn, 'pt-BR')).forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.url;
          opt.textContent = item.pn;
          selectPN.appendChild(opt);
        });
      } else {
        selectPN.disabled = true;
      }
    }

    function resetFields(level) {
      if (level === 'model') {
        document.getElementById('groupEdicao').style.display = 'block';
        document.getElementById('selectEdicao').innerHTML = '<option value="">Edição</option>';
        document.getElementById('selectEdicao').disabled = true;
      }
      document.getElementById('groupAcessorio').style.display = 'none';
      document.getElementById('selectAcessorio').innerHTML = '<option value="">Selecione o Acessório</option>';
      document.getElementById('selectAcessorio').disabled = true;

      document.getElementById('selectPN').innerHTML = '<option value="">PN</option>';
      document.getElementById('selectPN').disabled = true;
      document.getElementById('btnAbrir').disabled = true;
    }

    function validateSelection() {
      const selectPN = document.getElementById('selectPN');
      document.getElementById('btnAbrir').disabled = !selectPN.value;
    }

    function abrirManual() {
      const url = document.getElementById('selectPN').value;
      if (url) window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateThemeUI('dark');
      initExcel();

      document.getElementById('selectMarca').addEventListener('change', listModel);
      document.getElementById('selectModelo').addEventListener('change', listEditOrAccessories);
      document.getElementById('selectAcessorio').addEventListener('change', listPn);
      document.getElementById('selectEdicao').addEventListener('change', listPn);
      document.getElementById('selectPN').addEventListener('change', validateSelection);
    });
  </script>
</body>
</html>
